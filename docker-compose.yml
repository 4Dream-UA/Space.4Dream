version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: space_4dream_db
    environment:
      POSTGRES_DB: space_4dream
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    container_name: space_4dream_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=space_4dream
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SETTINGS_MODULE=space_4Dream.settings.development
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata: